[package]
name = "gitpiccrossplatform"
version = "0.1.0"
description = "Cross-platform GitHub and GitLab image uploader"
authors = ["GitPic contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gitpiccrossplatform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tokio = { version = "1.53.1", features = ["process", "fs", "sync", "time", "macros", "rt-multi-thread"] }
keyring = "4.1.5"
thiserror = "2.0.19"
percent-encoding = "2.3.2"
tempfile = "3.27.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "native-tls"] }

